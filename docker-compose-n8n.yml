version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai-guard-network

  postgres:
    image: postgres:15
    container_name: ai-guard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_guard
      POSTGRES_USER: ai_guard_user
      POSTGRES_PASSWORD: ai_guard_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-guard-network

volumes:
  n8n_data:
  postgres_data:

networks:
  ai-guard-network:
    driver: bridge