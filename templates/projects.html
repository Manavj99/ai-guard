{% extends "base.html" %}

{% block title %}Projects - AI-Guard Enterprise{% endblock %}

{% block content %}
<div class="row">
    <!-- Header -->
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Projects</h1>
                <p class="text-muted">Manage and monitor your AI-Guard projects.</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary" onclick="refreshProjects()">
                    <i class="fas fa-sync-alt me-1"></i>Refresh
                </button>
                <button class="btn btn-primary" onclick="addProject()">
                    <i class="fas fa-plus me-1"></i>Add Project
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Project Filters -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <select class="form-select" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="healthy">Healthy</option>
                            <option value="warning">Warning</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="searchFilter" placeholder="Search projects...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="sortFilter">
                            <option value="name">Sort by Name</option>
                            <option value="status">Sort by Status</option>
                            <option value="quality">Sort by Quality</option>
                            <option value="security">Sort by Security</option>
                            <option value="last_analysis">Sort by Last Analysis</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-outline-secondary" onclick="applyFilters()">
                            <i class="fas fa-filter me-1"></i>Apply Filters
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Projects Grid -->
<div class="row" id="projectsGrid">
    <!-- Projects will be loaded here -->
</div>

<!-- Project Details Modal -->
<div class="modal fade" id="projectModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="projectModalTitle">Project Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="projectModalBody">
                <!-- Project details will be loaded here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="editProject()">Edit</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
// Global variables
let projects = [];
let filteredProjects = [];

// Initialize projects page
document.addEventListener('DOMContentLoaded', function() {
    loadProjects();
    
    // Set up event listeners
    document.getElementById('statusFilter').addEventListener('change', applyFilters);
    document.getElementById('searchFilter').addEventListener('input', applyFilters);
    document.getElementById('sortFilter').addEventListener('change', applyFilters);
});

// Load projects data
async function loadProjects() {
    try {
        const response = await fetch('/api/projects');
        if (!response.ok) {
            throw new Error('Failed to load projects');
        }
        
        projects = await response.json();
        filteredProjects = [...projects];
        renderProjects();
    } catch (error) {
        console.error('Error loading projects:', error);
        AIGuard.showNotification('Failed to load projects: ' + error.message, 'danger');
    }
}

// Render projects grid
function renderProjects() {
    const grid = document.getElementById('projectsGrid');
    grid.innerHTML = '';
    
    if (filteredProjects.length === 0) {
        grid.innerHTML = `
            <div class="col-12">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-project-diagram fa-3x text-muted mb-3"></i>
                        <h5 class="card-title">No Projects Found</h5>
                        <p class="card-text text-muted">No projects match your current filters.</p>
                        <button class="btn btn-primary" onclick="clearFilters()">Clear Filters</button>
                    </div>
                </div>
            </div>
        `;
        return;
    }
    
    filteredProjects.forEach(project => {
        const projectCard = createProjectCard(project);
        grid.appendChild(projectCard);
    });
}

// Create project card
function createProjectCard(project) {
    const col = document.createElement('div');
    col.className = 'col-lg-4 col-md-6 mb-4';
    
    const statusColor = getStatusColor(project.status);
    const qualityColor = project.quality_score >= 80 ? 'success' : project.quality_score >= 60 ? 'warning' : 'danger';
    const securityColor = project.security_score >= 80 ? 'success' : project.security_score >= 60 ? 'warning' : 'danger';
    
    col.innerHTML = `
        <div class="card shadow h-100 project-card" onclick="showProjectDetails('${project.id}')">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h6 class="card-title mb-0">${project.name}</h6>
                    <span class="badge bg-${statusColor}">${project.status}</span>
                </div>
                <p class="card-text text-muted small">${project.description}</p>
                
                <div class="row text-center mb-3">
                    <div class="col-4">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">Quality</div>
                        <div class="h6 mb-0 text-${qualityColor}">${project.quality_score}%</div>
                    </div>
                    <div class="col-4">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">Security</div>
                        <div class="h6 mb-0 text-${securityColor}">${project.security_score}%</div>
                    </div>
                    <div class="col-4">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">Coverage</div>
                        <div class="h6 mb-0">${project.coverage}%</div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-muted">
                        <i class="fas fa-clock me-1"></i>
                        ${formatDateTime(project.last_analysis)}
                    </small>
                    <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); analyzeProject('${project.id}')">
                        <i class="fas fa-play me-1"></i>Analyze
                    </button>
                </div>
            </div>
        </div>
    `;
    
    return col;
}

// Show project details
function showProjectDetails(projectId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;
    
    document.getElementById('projectModalTitle').textContent = project.name;
    
    const statusColor = getStatusColor(project.status);
    const qualityColor = project.quality_score >= 80 ? 'success' : project.quality_score >= 60 ? 'warning' : 'danger';
    const securityColor = project.security_score >= 80 ? 'success' : project.security_score >= 60 ? 'warning' : 'danger';
    
    document.getElementById('projectModalBody').innerHTML = `
        <div class="row">
            <div class="col-md-6">
                <h6>Project Information</h6>
                <table class="table table-sm">
                    <tr>
                        <td><strong>Name:</strong></td>
                        <td>${project.name}</td>
                    </tr>
                    <tr>
                        <td><strong>Description:</strong></td>
                        <td>${project.description}</td>
                    </tr>
                    <tr>
                        <td><strong>Status:</strong></td>
                        <td><span class="badge bg-${statusColor}">${project.status}</span></td>
                    </tr>
                    <tr>
                        <td><strong>Last Analysis:</strong></td>
                        <td>${formatDateTime(project.last_analysis)}</td>
                    </tr>
                </table>
            </div>
            <div class="col-md-6">
                <h6>Quality Metrics</h6>
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <span>Quality Score</span>
                        <span class="text-${qualityColor}">${project.quality_score}%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar bg-${qualityColor}" style="width: ${project.quality_score}%"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <span>Security Score</span>
                        <span class="text-${securityColor}">${project.security_score}%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar bg-${securityColor}" style="width: ${project.security_score}%"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <span>Code Coverage</span>
                        <span>${project.coverage}%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar bg-info" style="width: ${project.coverage}%"></div>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    new bootstrap.Modal(document.getElementById('projectModal')).show();
}

// Apply filters
function applyFilters() {
    const statusFilter = document.getElementById('statusFilter').value;
    const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
    const sortFilter = document.getElementById('sortFilter').value;
    
    filteredProjects = projects.filter(project => {
        const matchesStatus = !statusFilter || project.status === statusFilter;
        const matchesSearch = !searchFilter || 
            project.name.toLowerCase().includes(searchFilter) ||
            project.description.toLowerCase().includes(searchFilter);
        
        return matchesStatus && matchesSearch;
    });
    
    // Sort projects
    filteredProjects.sort((a, b) => {
        switch (sortFilter) {
            case 'name':
                return a.name.localeCompare(b.name);
            case 'status':
                return a.status.localeCompare(b.status);
            case 'quality':
                return b.quality_score - a.quality_score;
            case 'security':
                return b.security_score - a.security_score;
            case 'last_analysis':
                return new Date(b.last_analysis) - new Date(a.last_analysis);
            default:
                return 0;
        }
    });
    
    renderProjects();
}

// Clear filters
function clearFilters() {
    document.getElementById('statusFilter').value = '';
    document.getElementById('searchFilter').value = '';
    document.getElementById('sortFilter').value = 'name';
    applyFilters();
}

// Refresh projects
function refreshProjects() {
    loadProjects();
    AIGuard.showNotification('Projects refreshed', 'success');
}

// Add project
function addProject() {
    AIGuard.showNotification('Add project functionality coming soon!', 'info');
}

// Edit project
function editProject() {
    AIGuard.showNotification('Edit project functionality coming soon!', 'info');
}

// Analyze project
function analyzeProject(projectId) {
    AIGuard.showNotification(`Starting analysis for project ${projectId}...`, 'info');
    // Implementation for project analysis
}

// Utility function
function getStatusColor(status) {
    switch(status) {
        case 'healthy': return 'success';
        case 'warning': return 'warning';
        case 'critical': return 'danger';
        default: return 'secondary';
    }
}

// Use AIGuard utility functions
const formatDateTime = AIGuard.formatDateTime;
</script>
{% endblock %}
